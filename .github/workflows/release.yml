name: Release

# Push a tag like v1.2.3 to build both apps and publish a GitHub release.
on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.v.outputs.version }}
      code: ${{ steps.v.outputs.code }}
      prerelease: ${{ steps.v.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v7
      - id: v
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME}"
          version="${tag#v}"
          if ! [[ "$version" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Tag '$tag' is not a valid semantic version"; exit 1
          fi
          # versionCode must increase with every release: major*10000 + minor*100 + patch
          code=$(( BASH_REMATCH[1] * 10000 + BASH_REMATCH[2] * 100 + BASH_REMATCH[3] ))
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "prerelease=$([[ -n "${BASH_REMATCH[4]}" ]] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - name: Release notes from CHANGELOG.md
        shell: pwsh
        run: ./scripts/release-notes.ps1 -Version '${{ steps.v.outputs.version }}'
      - uses: actions/upload-artifact@v7
        with:
          name: release-notes
          path: release-notes.md

  windows:
    needs: prepare
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x
      - name: Test
        run: dotnet test windows/WowQueueMonitor.sln -c Release
      - name: Publish exe
        shell: pwsh
        run: ./windows/publish.ps1 -Version '${{ needs.prepare.outputs.version }}'
      - name: Version the file name
        shell: pwsh
        run: Move-Item dist/windows/WowQueueAgent.exe "dist/WowQueueAgent-v${{ needs.prepare.outputs.version }}.exe"
      - uses: actions/upload-artifact@v7
        with:
          name: windows
          path: dist/WowQueueAgent-v*.exe

  android:
    needs: prepare
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: android/package-lock.json
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v6
      - name: Install
        working-directory: android
        run: npm ci
      - name: Typecheck and test
        working-directory: android
        run: |
          npx tsc --noEmit
          npx jest
      - name: Decode signing keystore
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::ANDROID_KEYSTORE_BASE64 not set; signing with the debug key (updates will not install over other builds)."
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          echo "WQ_KEYSTORE_FILE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
      - name: Build APK
        working-directory: android/android
        env:
          WQ_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          WQ_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          WQ_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon \
            -PappVersionName=${{ needs.prepare.outputs.version }} \
            -PappVersionCode=${{ needs.prepare.outputs.code }}
      - name: Version the file name
        run: mv android/android/app/build/outputs/apk/release/app-release.apk "WowQueue-v${{ needs.prepare.outputs.version }}.apk"
      - uses: actions/upload-artifact@v7
        with:
          name: android
          path: WowQueue-v*.apk

  publish:
    needs: [prepare, windows, android]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true
      - name: Checksums
        run: cd artifacts && sha256sum WowQueue*.apk WowQueueAgent*.exe > SHA256SUMS.txt
      - uses: softprops/action-gh-release@v3
        with:
          name: v${{ needs.prepare.outputs.version }}
          body_path: artifacts/release-notes.md
          prerelease: ${{ needs.prepare.outputs.prerelease == 'true' }}
          files: |
            artifacts/WowQueueAgent-v*.exe
            artifacts/WowQueue-v*.apk
            artifacts/SHA256SUMS.txt
